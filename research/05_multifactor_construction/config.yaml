# Multi-factor construction study — does blending signals help?

universe: [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU, XLRE]
start_date: "2015-12-31"
end_date:   "2025-12-31"
is_oos_split: "2020-12-31"

# Base signal pool. run.py evaluates:
#   - each signal individually
#   - every pair
#   - every triple
#   - the full 4-signal blend
# so the output shows how Sharpe evolves with k = 1..4.
signals: [mom12, mom1, lowvol, mr5]
quantile: 0.2

baseline_cost:
  commission_bps: 1.0
  spread_bps: 5.0
  impact_coeff: 0.3
  turnover_penalty: 0.25

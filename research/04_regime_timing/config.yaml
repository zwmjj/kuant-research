# Regime timing — does scaling signal exposure by VIX regime help?

universe: [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU, XLRE]
start_date: "2015-12-31"
end_date:   "2025-12-31"

signals: [mom12, mr5]   # the two signals most worth regime-timing

# VIX regime definition. "above_median" means risk-off regime.
regime_source: "^VIX"
regime_lookback_months: 12

# Scaling rules to compare:
#   full      — always 1.0 (baseline, no timing)
#   risk_off_only — 1.0 in high-VIX regime, 0 in low-VIX
#   risk_on_only  — 1.0 in low-VIX regime, 0 in high-VIX
#   scaled    — 1.5 in low-VIX, 0.5 in high-VIX (contrarian: load up
#               when calm, de-risk when panicked — the Barroso-Santa-
#               Clara momentum-crash insurance idea)
#   anti_scaled — 0.5 in low-VIX, 1.5 in high-VIX (defensive: de-risk
#               in calm, load up when panicked)

rules: [full, risk_off_only, risk_on_only, scaled, anti_scaled]

quantile: 0.2
baseline_cost:
  commission_bps: 1.0
  spread_bps: 5.0
  impact_coeff: 0.3
  turnover_penalty: 0.25

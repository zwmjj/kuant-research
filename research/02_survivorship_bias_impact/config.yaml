# Survivorship bias — synthetic demonstration of methodology.
#
# This study is the only one in the research book that CANNOT be
# fully reproduced from public data. The real version (in the main
# Kuant platform, quant/qf/data.py) uses WRDS CRSP with 8,446
# delisting returns applied from the Shumway 1997 methodology.
#
# Here we reproduce the *methodology* on synthetic data: we generate a
# universe of returns, deliberately delist a subset of assets with a
# negative shock, run a factor backtest on (a) the surviving-only
# subset and (b) the full delisting-adjusted panel, and measure the
# Sharpe gap. The gap represents the survivorship-bias inflation a
# naïve backtest would report.

n_assets: 50           # synthetic universe size
n_months: 240          # 20 years monthly
random_seed: 42

# Delisting parameters
delist_prob_per_month: 0.002     # ~4.8% of names delist each year
delist_return_mean: -0.30        # -30% delisting return (Shumway's -55%
                                 # for performance-delistings, -30% overall)
delist_return_std:  0.10
min_life_months:    24           # no delist in the first 2 years

# Factor / backtest parameters
signal: "mom12"
quantile: 0.2

baseline_cost:
  commission_bps: 1.0
  spread_bps: 5.0
  impact_coeff: 0.3
  turnover_penalty: 0.25

# Industry Rotation study — tunable parameters.
#
# Anything in this file is safe to change without editing code; run.py
# reads it on startup and passes the values through to signals.py.
# Values below match the reference run reported in README.md.

# Sample window (both inclusive).
start_date: "2000-01-31"
end_date:   "2025-12-31"

# Which French industry partition to use. Supported: 5, 10, 12, 17, 30, 38, 48, 49.
industry_universe: 10

# Momentum lookback in months. 12 matches Jegadeesh-Titman.
lookback_months: 12

# Long / short sleeve widths. With 10 industries and (3, 3) each side holds
# 3 industries equal-weighted, for a 6-name portfolio at 2x gross exposure.
top_n: 3
bottom_n: 3

# IS/OOS pivot — kept consistent with every other study in this repo so
# cross-study numbers compare cleanly.
is_oos_split: "2020-12-31"

# Rolling Sharpe windows. Each entry is [start, end, label].
rolling_windows:
  - ["2003-01-31", "2005-12-31", "03-05"]
  - ["2006-01-31", "2008-12-31", "06-08"]
  - ["2009-01-31", "2011-12-31", "09-11"]
  - ["2012-01-31", "2014-12-31", "12-14"]
  - ["2015-01-31", "2017-12-31", "15-17"]
  - ["2018-01-31", "2020-12-31", "18-20"]
  - ["2021-01-31", "2024-12-31", "21-24"]

# Whether to additionally compute the raw decile momentum spread (Hi-Lo)
# from Ken French's 10-portfolio prior-return sort.
include_decile_spread: true

# Whether to report OP (profitability) and INV (investment) premiums as a
# risk-premia sanity check.
include_op_inv_premiums: true

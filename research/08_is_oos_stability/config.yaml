# IS/OOS stability study — parameters.
#
# Same universe and signals as 01_signal_decay_vs_cost so the two studies
# compare apples-to-apples. This one focuses on the decomposition of
# full-sample Sharpe into pre- and post-2020 halves.

universe:
  - XLK
  - XLF
  - XLE
  - XLV
  - XLY
  - XLP
  - XLI
  - XLB
  - XLU
  - XLRE

start_date: "2015-12-31"
end_date:   "2025-12-31"
is_oos_split: "2020-12-31"

signals: [mom12, mom1, lowvol, mr5]
quantile: 0.2

baseline_cost:
  commission_bps: 1.0
  spread_bps: 5.0
  impact_coeff: 0.3
  turnover_penalty: 0.25

# Additional stability metrics: rolling 3Y windows for each signal
rolling_windows:
  - ["2016-01-31", "2018-12-31", "16-18"]
  - ["2019-01-31", "2021-12-31", "19-21"]
  - ["2022-01-31", "2025-12-31", "22-25"]

# Equity vol factor study — daily data to get stable vol estimates.

universe: [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU, XLRE,
           SPY, QQQ, IWM, EEM, TLT, HYG, LQD, GLD, SLV, USO]
start_date: "2016-01-04"
end_date:   "2025-12-31"
is_oos_split: "2020-12-31"

# Factor set — each factor takes a daily return panel and produces
# a *monthly* signal DataFrame for the standard quintile L/S engine.
signals:
  - rvol_12m        # realized 12-month vol, negated -> low-vol
  - downvol_12m     # 12-month downside semi-deviation, negated
  - volofvol        # 12-month rolling-std of 21-day rolling vol
  - beta_spy        # rolling 12-month beta vs SPY, negated -> BAB
  - skew            # 12-month skewness (prefer positive skew)

quantile: 0.25
baseline_cost:
  commission_bps: 1.0
  spread_bps: 5.0
  impact_coeff: 0.3
  turnover_penalty: 0.25

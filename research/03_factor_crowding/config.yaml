# Factor crowding study — run the four reference signals and regress
# each one's return stream on Fama-French 5 to decompose alpha from
# systematic exposures.

universe:
  [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU, XLRE]
start_date: "2015-12-31"
end_date:   "2025-12-31"

signals: [mom12, mom1, lowvol, mr5]
quantile: 0.2

baseline_cost:
  commission_bps: 1.0
  spread_bps: 5.0
  impact_coeff: 0.3
  turnover_penalty: 0.25
